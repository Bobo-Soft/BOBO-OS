# =============================================================================
# BOBO OS  -  Global Configuration
# E:\BOBO-OS\config\bobo-os.conf
#
# This file is sourced by all BOBO OS scripts and services.
# Syntax: KEY="VALUE"  (bash-compatible)
# =============================================================================

# --- Identity ---
OS_NAME="BOBO OS"
OS_VERSION="1.0.0"

# --- Filesystem Paths ---
# All project files live under ROOT_PATH.
# All third-party tools and compilers live under PROGRAMS_PATH.
ROOT_PATH="E:/BOBO-OS"
PROGRAMS_PATH="E:/Program Files"

# --- Performance Targets ---
# Maximum RAM usage at idle (megabytes)
TARGET_RAM_MB=400
# Maximum time from power-on to usable desktop (seconds)
TARGET_BOOT_SEC=8

# --- Kernel ---
KERNEL_VERSION="6.6-lts"

# --- Appearance ---
DEFAULT_THEME="bobo-default"

# --- Locale ---
# BCP-47 language tag. Overridden per-user at login.
DEFAULT_LOCALE="en_US"

# --- Feature Flags ---
# NovaLayer: multi-platform compatibility (Wine, Darling, iOS runtime, Waydroid)
NOVALAYER_ENABLED=true

# NovaSync: cloud sync daemon (iCloud, OneDrive, Google Drive)
NOVASYNC_ENABLED=true

# NovaStore: in-system app store
NOVASTORE_ENABLED=true

# Built-in AI assistant (Win+A)
AI_ASSISTANT_ENABLED=true

# Telemetry: BOBO OS collects zero telemetry by default
TELEMETRY_ENABLED=false

# --- NovaLayer Tool Paths ---
# Used by novalayer-daemon.py to locate runtime wrappers
WINE_WRAPPER="${ROOT_PATH}/core/novalayer/wine/wine-wrapper.sh"
DARLING_WRAPPER="${ROOT_PATH}/core/novalayer/darling/darling-wrapper.sh"
IOS_LAUNCHER="${ROOT_PATH}/core/novalayer/ios-runtime/ios-launcher.py"
WAYDROID_DIR="${PROGRAMS_PATH}/waydroid"

# --- Wine Settings ---
# Base directory for per-application Wine prefixes
WINE_PREFIXES_DIR="${HOME}/.bobo/wine-prefixes"
# Path to compiled Wine binary
WINE_BIN="${PROGRAMS_PATH}/wine-src/dist/bin/wine64"
# Path to DXVK DLLs (copied into each prefix on first run)
DXVK_DIR="${PROGRAMS_PATH}/wine-src/dxvk"

# --- Build Paths ---
BUILD_OUTPUT="${ROOT_PATH}/build-output"
ISO_PATH="${BUILD_OUTPUT}/BOBO-OS-v1.0.iso"
KERNEL_CONFIG="${ROOT_PATH}/boot/kernel/kernel.config"
GRUB_CONFIG="${ROOT_PATH}/boot/grub/grub.cfg"

# --- Logging ---
LOG_DIR="/var/log"
NOVALAYER_LOG="${LOG_DIR}/novalayer.log"
NOVASYNC_LOG="${LOG_DIR}/novasync.log"
FIREWALL_LOG="${LOG_DIR}/bobo-firewall.log"
DRIVER_LOG="${LOG_DIR}/bobo-drivers.log"
IOS_LOG="${LOG_DIR}/bobo-ios.log"
UPDATE_LOG="${LOG_DIR}/bobo-updates.log"

# --- Security ---
# LUKS2 encryption: offered at install time, not forced
ENCRYPTION_ENABLED=false
# TPM2 auto-unlock: only available if TPM2 chip present
TPM2_UNLOCK=false

# --- NovaSync Cloud Providers ---
NOVASYNC_ICLOUD=true
NOVASYNC_ONEDRIVE=true
NOVASYNC_GOOGLEDRIVE=true
NOVASYNC_NEXTCLOUD=false
NOVASYNC_DROPBOX=false

# --- AI Assistant Backend ---
# "ollama" = local LLM (private, slower)
# "cloud"  = Anthropic/OpenAI API (faster, requires internet + API key)
AI_BACKEND="ollama"
AI_OLLAMA_MODEL="llama3"
AI_CLOUD_MODEL="claude-haiku-4-5-20251001"

# --- zram ---
# Fraction of total RAM to allocate to zram (0.5 = 50%)
ZRAM_RATIO=0.5
ZRAM_ALGO="lz4"

# --- Display ---
# Wayland is the primary display server; X11 is the fallback.
DISPLAY_SERVER="wayland"
WINDOW_MANAGER="wayfire"
