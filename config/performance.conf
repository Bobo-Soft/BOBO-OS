# =============================================================================
# BOBO OS  -  Performance Configuration
# E:\BOBO-OS\config\performance.conf
#
# Tuning parameters for CPU scheduling, I/O, memory, and GPU.
# Sourced by core/init/1 (stage 1) and scripts/setup-tools.sh.
# All values are chosen for a balance of responsiveness and battery life.
# =============================================================================

# ---------------------------------------------------------------------------
# CPU Governor
# Choices: performance | powersave | schedutil (recommended) | ondemand
# schedutil is kernel-managed and responds to scheduler load signals  -  best
# for desktop responsiveness without pinning to max frequency.
# ---------------------------------------------------------------------------
CPU_GOVERNOR="schedutil"

# Energy Performance Preference (EPP)  -  for Intel HWP / AMD CPPC
# Choices: performance | balance_performance | balance_power | power
CPU_EPP="balance_performance"

# Disable CPU mitigations for retpoline/Spectre on trusted local machines.
# Set to false to keep full mitigations (recommended for shared/public systems).
CPU_MITIGATIONS_OFF=false

# ---------------------------------------------------------------------------
# I/O Scheduler
# Choices: mq-deadline (SSD recommended) | bfq (HDD, fairness) | none (NVMe)
# Applied per-device via udev rule written by this config.
# ---------------------------------------------------------------------------
IO_SCHEDULER_SSD="mq-deadline"
IO_SCHEDULER_HDD="bfq"
IO_SCHEDULER_NVME="none"

# Read-ahead size in KB for block devices (0 = kernel default)
IO_READAHEAD_KB=256

# ---------------------------------------------------------------------------
# Memory / swap
# ---------------------------------------------------------------------------
# vm.swappiness  -  how aggressively the kernel moves pages to swap.
# 10–30 for desktop, 80 when zram is the swap device (zram is fast).
VM_SWAPPINESS=80

# vm.vfs_cache_pressure  -  how aggressively to reclaim inode/dentry caches.
# 50 = less aggressive than default (100), keeps filesystem caches longer.
VM_VFS_CACHE_PRESSURE=50

# vm.dirty_ratio  -  % of RAM that can hold dirty pages before writeback starts
VM_DIRTY_RATIO=10

# vm.dirty_background_ratio  -  % of RAM for background writeback trigger
VM_DIRTY_BACKGROUND_RATIO=5

# Transparent Huge Pages: madvise = only for processes that request it
THP_MODE="madvise"

# ---------------------------------------------------------------------------
# Network performance
# ---------------------------------------------------------------------------
# TCP congestion control algorithm
# bbr = Google's BBR (recommended for modern kernels, reduces latency under load)
NET_TCP_CONGESTION="bbr"

# Enable TCP Fast Open (reduces connection latency for repeat connections)
NET_TCP_FAST_OPEN=3

# ---------------------------------------------------------------------------
# GPU / display
# ---------------------------------------------------------------------------
# Wayland compositor VSync mode  -  leave empty to use Wayfire default
# Options: "" | "immediate" (tear-free off) | "adaptive"
COMPOSITOR_VSYNC=""

# DRM render node for Vulkan/VA-API (leave empty for auto-detection)
DRM_RENDER_NODE=""

# ---------------------------------------------------------------------------
# Process priority (nice / ionice)
# ---------------------------------------------------------------------------
# Priority of the BOBO OS desktop compositor (Wayfire)
COMPOSITOR_NICE=-5

# Priority of the AI assistant daemon (keep low to not compete with apps)
AI_DAEMON_NICE=10

# Priority of the NovaStore backend (FastAPI/uvicorn)
NOVASTORE_NICE=5

# ---------------------------------------------------------------------------
# Boot performance
# ---------------------------------------------------------------------------
# systemd / runit: maximum parallel service starts
MAX_PARALLEL_SERVICES=8

# Disable journald persistence to RAM-only (reduces disk writes, faster boot)
JOURNAL_STORAGE="volatile"

# ---------------------------------------------------------------------------
# zram (also in bobo-os.conf; values here override if both are sourced)
# ---------------------------------------------------------------------------
ZRAM_RATIO=0.5
ZRAM_ALGO="lz4"
ZRAM_PRIORITY=100
DISK_SWAP_PRIORITY=10
