# =============================================================================
# BOBO OS  -  Security Configuration
# E:\BOBO-OS\config\security.conf
#
# Master security policy for BOBO OS.
# Read by: firewall-setup.sh, sandbox.py, encryption-setup.sh, installer.
# =============================================================================

# ---------------------------------------------------------------------------
# Firewall
# ---------------------------------------------------------------------------
# Default profile applied at boot.  Choices: home | work | public
FIREWALL_DEFAULT_PROFILE="home"

# Path to list of trusted home SSIDs (one per line).
# When connected to an SSID in this file, home profile is auto-selected.
FIREWALL_HOME_SSIDS_FILE="/etc/bobo-os/home-networks.conf"

# Path to per-app UID block list (one UID per line).
FIREWALL_BLOCKED_APPS_CONF="/etc/bobo-os/blocked-apps.conf"

# Log dropped packets to:
FIREWALL_LOG_FILE="/var/log/bobo-firewall.log"

# ---------------------------------------------------------------------------
# Disk encryption (LUKS2)
# ---------------------------------------------------------------------------
# Whether full-disk encryption was enabled at install time.
ENCRYPTION_ENABLED=false

# LUKS2 key derivation function (Argon2id recommended for LUKS2).
LUKS2_KDF="argon2id"

# TPM2 enrollment: true if clevis luks bind was run successfully.
TPM2_ENROLLED=false

# Fingerprint biometric: true if fprintd-enroll completed successfully.
FPRINT_ENABLED=false

# Path where recovery keys are stored (chmod 400, root only).
RECOVERY_KEY_DIR="/etc/bobo-os/recovery"

# ---------------------------------------------------------------------------
# Per-app sandbox (sandbox.py)
# ---------------------------------------------------------------------------
# Whether to sandbox all apps launched via NovaLayer by default.
SANDBOX_ENABLED=true

# Which sandboxing backend to prefer.
# Choices: bwrap (bubblewrap, recommended) | firejail | none
SANDBOX_BACKEND="bwrap"

# Default network permission for new apps (true = ask user, false = deny).
SANDBOX_DEFAULT_ASK_NETWORK=true

# Seccomp BPF filter: true = apply strict allowlist filter inside sandbox.
SANDBOX_SECCOMP=true

# ---------------------------------------------------------------------------
# AppArmor / SELinux (kernel-level MAC)
# ---------------------------------------------------------------------------
# BOBO OS ships with AppArmor profiles for high-risk services.
APPARMOR_ENABLED=true

# Profiles directory (additional profiles can be dropped here).
APPARMOR_PROFILES_DIR="/etc/apparmor.d/bobo"

# ---------------------------------------------------------------------------
# Antivirus (ClamAV)
# ---------------------------------------------------------------------------
# Whether ClamAV on-access scanning is enabled (requires clamav-daemon).
CLAMAV_ENABLED=true

# Directories to monitor for on-access scanning.
CLAMAV_WATCH_DIRS="${HOME}/Downloads ${HOME}/Desktop /tmp"

# Signature database update schedule (cron expression; default: daily at 3am).
CLAMAV_UPDATE_CRON="0 3 * * *"

# ---------------------------------------------------------------------------
# Auto-lock / screen lock
# ---------------------------------------------------------------------------
# Minutes of inactivity before locking the screen (0 = never).
AUTOLOCK_MINUTES=5

# Lock command (called by wayfire idle plugin).
LOCK_CMD="swaylock -f -c 1a1a2e --font Inter"

# ---------------------------------------------------------------------------
# Secure Boot
# ---------------------------------------------------------------------------
# Whether to enroll BOBO OS signing key in UEFI Secure Boot DB.
SECURE_BOOT_ENROLL=false

# Path to the MOK (Machine Owner Key) for Secure Boot enrollment.
MOK_KEY_DIR="/etc/bobo-os/secureboot"

# ---------------------------------------------------------------------------
# SSH hardening (applied by setup-tools.sh to /etc/ssh/sshd_config)
# ---------------------------------------------------------------------------
SSH_PERMIT_ROOT_LOGIN=false
SSH_PASSWORD_AUTH=false
SSH_MAX_AUTH_TRIES=3
SSH_LISTEN_PORT=22

# ---------------------------------------------------------------------------
# DNS over HTTPS / DNSSEC
# ---------------------------------------------------------------------------
# DoH provider URL (used by systemd-resolved stub resolver).
# Cloudflare: https://cloudflare-dns.com/dns-query
# NextDNS:    https://dns.nextdns.io/<id>
DOH_URL="https://cloudflare-dns.com/dns-query"
DNSSEC_ENABLED=true

# ---------------------------------------------------------------------------
# Privacy
# ---------------------------------------------------------------------------
# Disable coredumps for all processes (prevents credential leaks).
COREDUMPS_DISABLED=true

# Clear /tmp on each boot.
TMP_CLEAR_ON_BOOT=true

# Kernel pointer restriction: 1 = hide from non-root, 2 = hide from all.
KPTR_RESTRICT=1

# Restrict /proc/<pid>/ access to process owner and root.
PTRACE_SCOPE=1
