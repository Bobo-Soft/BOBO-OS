# =============================================================================
# BOBO OS - GRUB2 Bootloader Configuration
# E:\BOBO-OS\boot\grub\grub.cfg
#
# Supports: UEFI (EFI boot) + Legacy BIOS (MBR boot)
# Font:     GRUB unifont (large, readable on HiDPI)
# Colors:   BOBO OS dark theme (#1a1a2e bg, #4a9eff accent)
# Timeout:  3 seconds - default entry starts automatically
#
# NOTE: All menu entry labels and echo strings use ASCII only.
# GRUB2 .pf2 fonts do not support emoji or extended Unicode.
# =============================================================================

# ---------------------------------------------------------------------------
# Timeout and default entry
# ---------------------------------------------------------------------------
set default=0
set timeout=3
set timeout_style=countdown

# ---------------------------------------------------------------------------
# Load GRUB modules needed for themed menus and UEFI/BIOS compatibility
# ---------------------------------------------------------------------------
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod jpeg
insmod font
insmod video_bochs
insmod video_cirrus
insmod vbe
insmod vga

# ---------------------------------------------------------------------------
# Load custom font (large readable text on 1080p+ displays)
# ---------------------------------------------------------------------------
if loadfont /boot/grub/fonts/unicode.pf2; then
  set gfxmode=auto
  terminal_output gfxterm
fi

# ---------------------------------------------------------------------------
# BOBO OS color theme - dark background, blue accent
# Matches design tokens: #1a1a2e bg, #4a9eff accent, #ffffff text
# ---------------------------------------------------------------------------
set color_normal=light-gray/black
set color_highlight=white/blue
set menu_color_normal=white/black
set menu_color_highlight=black/light-blue

# ---------------------------------------------------------------------------
# Background splash image (BOBO OS branded wallpaper)
# ---------------------------------------------------------------------------
if background_image /boot/grub/splash.png; then
  set color_normal=white/black
  set color_highlight=black/light-blue
fi

# ---------------------------------------------------------------------------
# Detect if we are on EFI or BIOS - set rootfs search accordingly
# ---------------------------------------------------------------------------
if [ -z "$grub_platform" ]; then
  set grub_platform=pc
fi

# ---------------------------------------------------------------------------
# Find the BOBO OS root partition automatically
# (Searches for the partition that contains /etc/bobo-os-release)
# ---------------------------------------------------------------------------
search --no-floppy --file --set=root /etc/bobo-os-release

# ---------------------------------------------------------------------------
# Kernel and initrd paths (relative to found root partition)
# ---------------------------------------------------------------------------
set KERNEL=/boot/vmlinuz-6.6-bobo
set INITRD=/boot/initrd-6.6-bobo.img
set BOOT_PARAMS="noapic quiet splash loglevel=3 rd.systemd.show_status=false udev.log_level=3"

# ---------------------------------------------------------------------------
# MENU ENTRY 1 - Normal boot (default)
# ---------------------------------------------------------------------------
menuentry "Start BOBO OS" --class bobo --class gnu-linux --class gnu --class os {
  set gfxpayload=keep
  insmod gzio
  insmod part_gpt
  insmod part_msdos
  insmod ext2

  echo "Loading BOBO OS kernel..."
  linux   $KERNEL root=LABEL=BOBO-OS-ROOT rw $BOOT_PARAMS

  echo "Loading initial RAM disk..."
  initrd  $INITRD
}

# ---------------------------------------------------------------------------
# MENU ENTRY 2 - Safe Mode (no GPU acceleration, single-user)
# Use this if the desktop fails to start or display issues occur
# ---------------------------------------------------------------------------
menuentry "BOBO OS - Safe Mode" --class bobo {
  set gfxpayload=keep
  insmod gzio
  insmod part_gpt
  insmod part_msdos
  insmod ext2

  echo "Loading BOBO OS (Safe Mode)..."
  linux   $KERNEL root=LABEL=BOBO-OS-ROOT rw \
    noapic \
    nomodeset \
    systemd.unit=rescue.target \
    loglevel=6 \
    rd.driver.blacklist=nouveau,amdgpu,i915

  initrd  $INITRD
}

# ---------------------------------------------------------------------------
# MENU ENTRY 3 - Live USB Mode (load entire OS into RAM)
# On systems with >= 4 GB RAM: toram copies squashfs to memory.
# Eject the USB stick after boot - system runs fully in RAM.
# ---------------------------------------------------------------------------
menuentry "BOBO OS - Live USB Mode" --class bobo {
  set gfxpayload=keep
  insmod gzio
  insmod part_gpt
  insmod part_msdos
  insmod ext2
  insmod iso9660

  echo "Loading BOBO OS Live USB (copying to RAM)..."
  linux   $KERNEL boot=live toram findiso=$isofile \
    root=LABEL=BOBO-OS-LIVE rw $BOOT_PARAMS

  initrd  $INITRD
}

# ---------------------------------------------------------------------------
# MENU ENTRY 4 - System Recovery
# Drops into a minimal rescue shell with basic tools available.
# Network is not started. Useful for fixing broken installs.
# ---------------------------------------------------------------------------
menuentry "System Recovery" --class recovery {
  set gfxpayload=keep
  insmod gzio
  insmod part_gpt
  insmod part_msdos
  insmod ext2

  echo "Loading BOBO OS System Recovery..."
  linux   $KERNEL root=LABEL=BOBO-OS-ROOT rw \
    noapic \
    systemd.unit=emergency.target \
    loglevel=7 \
    rd.break \
    init=/bin/bash

  initrd  $INITRD
}

# ---------------------------------------------------------------------------
# Auto-detect other operating systems (dual boot)
# If os-prober finds Windows or another Linux, add them here automatically.
# ---------------------------------------------------------------------------
if [ -f /boot/grub/grub.d/30_os-prober ]; then
  source /boot/grub/grub.d/30_os-prober
fi

