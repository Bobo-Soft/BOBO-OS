# Scurtaturi globale BOBO OS pentru aplicatiile concernului
# Incluse in /etc/bobo-wayfire-defaults.ini si referite din ~/.config/wayfire.ini
[command]
binding_player   = <super> KEY_V
command_player   = bobo-player
binding_monitor  = <ctrl> <shift> KEY_ESC
command_monitor  = bobo-monitor
binding_settings = <super> KEY_I
command_settings = bobo-settings
binding_search   = <super> KEY_SPACE
command_search   = bobo-search
binding_ai       = <super> KEY_A
command_ai       = bobo-ai-local
binding_notif    = <super> KEY_N
command_notif    = bobo-notif --toggle
binding_ss_full  = KEY_PRINT
command_ss_full  = bobo-screen --full
binding_ss_reg   = <shift> KEY_PRINT
command_ss_reg   = bobo-screen --region
binding_ss_win   = <alt> KEY_PRINT
command_ss_win   = bobo-screen --window
binding_ss_rec   = <ctrl> <alt> KEY_R
command_ss_rec   = bobo-screen --record
