# =============================================================================
# BOBO OS  -  Terminal Emulator Configuration (foot)
# E:\BOBO-OS\apps\terminal\terminal.conf
#
# foot is the primary terminal for BOBO OS: fast, Wayland-native, minimal.
# This file is installed to ~/.config/foot/foot.ini.
# Falls back to: Alacritty (X11/Wayland) -> xterm (emergency only).
# =============================================================================

[main]
# Font: Inter Mono at 11pt; fallback to monospace
font=Inter Mono:size=11
font-bold=Inter Mono:size=11:weight=Bold
font-italic=Inter Mono:size=11:style=Italic
dpi-aware=yes

# Geometry: 100 columns × 32 rows (reasonable default for most displays)
initial-window-size-chars=100x32
initial-window-mode=windowed

# Keep 10 000 lines of scrollback
scrollback.lines=10000
scrollback.multiplier=3.0

# Shell: use $SHELL, fallback to bash
shell=${SHELL:-/bin/bash}

# Window title from shell/application
title=Terminal
app-id=os.bobo.Terminal

[mouse]
# Right-click -> paste (Windows-style)
hide-when-typing=yes

[key-bindings]
# Standard terminal shortcuts
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
search-start=Control+Shift+f
font-increase=Control+equal
font-decrease=Control+minus
font-reset=Control+0
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
new-terminal=Control+Shift+n

[colors]
# BOBO OS dark colour scheme  -  matches #1a1a2e background
alpha=0.95
background=1a1a2e
foreground=e8e8f0

# ANSI colours (dark)
regular0=1a1a2e  # black
regular1=ff5555  # red
regular2=50fa7b  # green
regular3=f1fa8c  # yellow
regular4=4a9eff  # blue (accent)
regular5=bd93f9  # magenta
regular6=8be9fd  # cyan
regular7=f8f8f2  # white

# Bright colours
bright0=44475a
bright1=ff6e6e
bright2=69ff94
bright3=ffffa5
bright4=6ab0ff
bright5=d6acff
bright6=a4ffff
bright7=ffffff

# Selection colours
selection-background=4a9eff
selection-foreground=1a1a2e

# URLs highlighted on hover
url-color=4a9eff

[cursor]
# Blinking bar cursor (feels modern)
style=bar
blink=yes
beam-thickness=1.5

[url]
# Click URLs (Ctrl+click or hover)
launch=xdg-open ${url}
osc8-underline=url-mode

[tweak]
# Use VTE-compatible escape sequences for best app compatibility
allow-overriding-key-bindings=no
grapheme-shaping=maybe
