# =============================================================================
# BOBO OS — Wayfire Window Manager Configuration (Phase 5.1)
# E:\BOBO-OS\desktop\window-manager\wayfire.ini
#
# Wayfire is a 3D Wayland compositor used as BOBO OS's window manager.
# Design: 8px corner radius, 150ms animations, shadows, Windows-style bindings.
# =============================================================================

[core]
# Plugins to load — order matters for some (blur before others)
plugins = \
  alpha \
  animate \
  autostart \
  blur \
  command \
  decoration \
  expo \
  fast-switcher \
  grid \
  idle \
  move \
  oswitch \
  place \
  resize \
  scale \
  switcher \
  wm-actions \
  wobbly \
  wrot \
  vswitch

# XWayland: enable for Wine / legacy X11 apps
xwayland = true

# Output configuration (auto-detect monitors)
output_manager = auto

# =============================================================================
# [output] — Display configuration
# Per-monitor settings. "auto" lets Wayfire detect connected displays.
# =============================================================================

[output:auto]
mode         = auto
position     = auto
transform    = normal
scale        = 1.0

# =============================================================================
# [decoration] — Window borders and title bars
# =============================================================================

[decoration]
# Title bar height (px)
title_height     = 32
# Corner rounding radius (design token: 8px)
border_radius    = 8
# Border width
border_size      = 1
# Active window border color (accent: #4a9eff)
active_color     = \#4a9eff
# Inactive window border color
inactive_color   = \#3a3a5c
# Window shadow (design token: 0 4px 24px rgba(0,0,0,0.4))
active_shadow_radius   = 24
active_shadow_color    = 0.0 0.0 0.0 0.4
inactive_shadow_radius = 12
inactive_shadow_color  = 0.0 0.0 0.0 0.2
# Title font (Inter → Segoe UI → system-ui)
font = Inter 10

# =============================================================================
# [animate] — Window open/close/minimize animations
# All transitions: 150ms ease-in-out (design token)
# =============================================================================

[animate]
open_animation   = zoom
close_animation  = zoom
minimize_animation = minimize
duration         = 150
# Zoom start scale (0.8 = zoom in from 80% size)
zoom_factor      = 0.85

# =============================================================================
# [blur] — Frosted-glass blur effect on taskbar and panels
# =============================================================================

[blur]
method         = kawase
kawase_passes  = 4
kawase_offset  = 2.0
saturation     = 1.0

# =============================================================================
# [grid] — Window snapping (Win+Left/Right = snap to half)
# =============================================================================

[grid]
# Duration of snap animation
duration    = 150
# Restore on second press of the same binding
restore_duration = 150
# Workaround slots:
# 7 8 9
# 4 5 6
# 1 2 3
# We use only 4 (left half) and 6 (right half) for Windows-style snapping.
slot_l  = <super> KEY_LEFT
slot_r  = <super> KEY_RIGHT
slot_tl = <super><shift> KEY_LEFT
slot_tr = <super><shift> KEY_RIGHT
# Maximize: Win+Up
slot_c  = <super> KEY_UP
# Minimize to grid position: Win+Down
slot_b  = <super> KEY_DOWN

# =============================================================================
# [switcher] — Alt+Tab window switcher
# =============================================================================

[switcher]
next_view    = <alt> KEY_TAB
prev_view    = <alt><shift> KEY_TAB
# Preview thumbnails in the switcher overlay
view_thumbnail_size = 180

# =============================================================================
# [expo] — Win+Tab → workspace/window overview
# =============================================================================

[expo]
toggle          = <super> KEY_TAB
# Duration for the overview zoom animation
duration        = 200
# Background color behind windows in overview (#1a1a2e = BOBO dark bg)
background_color = 0.102 0.102 0.180 1.0

# =============================================================================
# [scale] — App Exposé (show all windows of current app)
# =============================================================================

[scale]
toggle = <super> KEY_S
# Animation duration
duration = 150

# =============================================================================
# [move] — Move windows by dragging their title bar
# (Also: Alt+drag anywhere in the window)
# =============================================================================

[move]
activate = <alt> BTN_LEFT
# Remember which monitor a window was on; restore on workspace switch
enable_snap = true

# =============================================================================
# [resize] — Resize windows
# =============================================================================

[resize]
activate = <alt> BTN_RIGHT

# =============================================================================
# [command] — Keyboard shortcuts that launch programs
# =============================================================================

[command]
# Win+D — show/hide desktop (minimize all)
binding_show_desktop    = <super> KEY_D
command_show_desktop    = wm-actions toggle-showdesktop

# Win+E — open file manager
binding_files    = <super> KEY_E
command_files    = nemo

# Win+L — lock screen
binding_lock    = <super> KEY_L
command_lock    = swaylock -f -c 1a1a2e

# Win+R — run dialog (rofi or wofi)
binding_run    = <super> KEY_R
command_run    = wofi --show run

# Win+A — AI assistant panel
binding_ai    = <super> KEY_A
command_ai    = python3 /usr/local/lib/bobo/ai-assistant/assistant-ui.py

# Win+N — notification center
binding_notif    = <super> KEY_N
command_notif    = python3 /usr/local/lib/bobo/desktop/notifications/notifications.py --toggle

# PrintScreen — screenshot
binding_screenshot    = KEY_SYSRQ
command_screenshot    = grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# Alt+F4 — close focused window
binding_close    = <alt> KEY_F4
command_close    = wm-actions close

# Win+V — clipboard history
binding_clipboard    = <super> KEY_V
command_clipboard    = cliphist list | wofi --dmenu | cliphist decode | wl-copy

# =============================================================================
# [wm-actions] — Window management actions
# =============================================================================

[wm-actions]
toggle_fullscreen   = <alt> KEY_F11
toggle_always_on_top = <super><alt> KEY_T
toggle_sticky        = <super><alt> KEY_S

# =============================================================================
# [idle] — Screen timeout and lock
# =============================================================================

[idle]
# Time in seconds before screen dims (5 minutes)
dpms_timeout = 300
# Lock screen after 10 minutes
screensaver_timeout = 600
screensaver = swaylock -f -c 1a1a2e

# =============================================================================
# [place] — Window placement strategy (center new windows)
# =============================================================================

[place]
mode = cascade

# =============================================================================
# [vswitch] — Virtual workspaces (BOBO OS uses 4 workspaces)
# =============================================================================

[vswitch]
binding_left  = <ctrl><alt> KEY_LEFT
binding_right = <ctrl><alt> KEY_RIGHT
binding_up    = <ctrl><alt> KEY_UP
binding_down  = <ctrl><alt> KEY_DOWN
# Move window to next workspace
binding_win_left  = <ctrl><alt><super> KEY_LEFT
binding_win_right = <ctrl><alt><super> KEY_RIGHT

# =============================================================================
# [autostart] — Programs launched automatically when Wayfire starts
# =============================================================================

[autostart]
# Taskbar (anchored to bottom edge)
taskbar    = python3 /usr/local/lib/bobo/desktop/taskbar/taskbar.py
# PipeWire audio session manager
pipewire-pulse = /usr/bin/pipewire-pulse
# Notification daemon
notifications = python3 /usr/local/lib/bobo/desktop/notifications/notifications.py
# Hardware auto-detection on first boot
autodetect = /usr/local/lib/bobo/drivers/auto-detect.sh
# Set wallpaper
wallpaper = swaybg -m fill -i /usr/share/bobo-os/wallpapers/default.png

# =============================================================================
# [wobbly] — Optional: wobbly windows (can be disabled in Settings → Appearance)
# =============================================================================

[wobbly]
spring_k   = 8.0
friction   = 3.0
mass       = 30.0
